<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>相同数字查找器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
      padding: 20px 12px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { font-size: 20px; color: #1e293b; margin-bottom: 6px; text-align: center; }
    .subtitle { color: #64748b; font-size: 13px; margin-bottom: 16px; text-align: center; }

    .table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      overflow-x: auto;
      width: 100%;
      max-width: 600px;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; min-width: 420px; border-collapse: collapse; }
    th, td {
      padding: 12px 8px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
      border-right: 2px solid #cbd5e1;
      position: relative;
    }
    th:last-child, td:last-child { border-right: none; }
    th {
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      font-size: 12px;
      border-bottom: 2px solid #94a3b8;
      white-space: nowrap;
    }
    td {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
    }
    tbody tr:nth-child(odd) { background: #fef2f2; }
    tbody tr:nth-child(even) { background: #eff6ff; }
    tbody tr:hover { filter: brightness(0.96); }

    td input {
      width: 100%;
      min-width: 50px;
      text-align: center;
      border: none;
      background: transparent;
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      outline: none;
      padding: 6px 2px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      transition: background 0.15s;
      position: relative;
      z-index: 1;
    }
    td input:focus { background: rgba(0,0,0,0.04); box-shadow: inset 0 0 0 2px #475569; }
    td input::placeholder { color: transparent; }
    .col-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #334155;
      color: #fff;
      font-size: 11px;
      margin-left: 4px;
      font-weight: 700;
    }
    .result-input {
      color: #059669;
      min-width: 50px;
      font-size: 22px;
    }
    .weekday-cell {
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .top-actions {
      margin-top: 14px;
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1 1 auto;
      min-width: 80px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #334155;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
      text-align: center;
    }
    .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: #334155; color: #fff; border-color: #334155; }
    .btn-primary:hover { background: #475569; }
    .btn-success { background: #059669; color: #fff; border-color: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #ef4444; color: #fff; border-color: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-info { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
    .btn-info:hover { background: #0284c7; }
    .btn-warning { background: #f59e0b; color: #fff; border-color: #f59e0b; }
    .btn-warning:hover { background: #d97706; }
    .btn-purple { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
    .btn-purple:hover { background: #7c3aed; }
    .btn-pink { background: #ec4899; color: #fff; border-color: #ec4899; }
    .btn-pink:hover { background: #db2777; }

    .btn-section {
      margin-top: 14px;
      width: 100%;
      max-width: 600px;
    }
    .btn-section-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      padding-left: 4px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #importFileCol1, #importFileCol2, #importFileCol4 { display: none; }
    .hint {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      padding: 0 10px;
    }

    @media (max-width: 400px) {
      body { padding: 12px 8px 30px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 12px; }
      th, td { padding: 9px 4px; font-size: 16px; }
      td input { font-size: 16px; padding: 4px 1px; }
      .result-input { font-size: 18px; }
      .weekday-cell { font-size: 11px; }
      .btn { padding: 8px 10px; font-size: 12px; }
      .col-label { width: 16px; height: 16px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <h1>🔢 相同数字查找器</h1>
  <p class="subtitle">在左侧和中间列输入数字，右侧自动显示两数中相同的数字</p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:50px;">日期</th>
          <th>左侧列 <span class="col-label">1</span></th>
          <th>中间列 <span class="col-label">2</span></th>
          <th>相同数字 <span class="col-label">3</span></th>
          <th>右侧列 <span class="col-label">4</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="top-actions">
    <button class="btn btn-primary" onclick="addRow()">+ 添加一行</button>
    <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空</button>
  </div>

  <div class="btn-section">
    <div class="btn-section-title">📁 左侧列 1</div>
    <div class="btn-group">
      <button class="btn btn-success" onclick="exportCol1()">📤 导出列1</button>
      <button class="btn" onclick="document.getElementById('importFileCol1').click()">📥 导入列1</button>
      <input type="file" id="importFileCol1" accept=".txt" onchange="importCol1(event)">
    </div>
  </div>

  <div class="btn-section">
    <div class="btn-section-title">📁 中间列 2</div>
    <div class="btn-group">
      <button class="btn btn-info" onclick="exportCol2()">📤 导出列2</button>
      <button class="btn btn-warning" onclick="document.getElementById('importFileCol2').click()">📥 导入列2</button>
      <input type="file" id="importFileCol2" accept=".txt" onchange="importCol2(event)">
    </div>
  </div>

  <div class="btn-section">
    <div class="btn-section-title">📁 右侧列 4</div>
    <div class="btn-group">
      <button class="btn btn-purple" onclick="exportCol4()">📤 导出列4</button>
      <button class="btn btn-pink" onclick="document.getElementById('importFileCol4').click()">📥 导入列4</button>
      <input type="file" id="importFileCol4" accept=".txt" onchange="importCol4(event)">
    </div>
  </div>

  <p class="hint">💡 数据已自动保存到浏览器，关闭后重新打开不会丢失</p>

  <script>
    const STORAGE_KEY = 'number_tool_data';
    const weekdays = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

    const defaultData = [
      ['5790', '2600', '', ''],
      ['1266', '', '', ''],
      ['2489', '4669', '', ''],
      ['6899', '', '', ''],
      ['7778', '', '', ''],
      ['2237', '1246', '', ''],
      ['1249', '', '', ''],
      ['1136', '2478', '', ''],
    ];

    function getWeekday(idx) {
      return weekdays[idx % 7];
    }

    function findCommonDigits(a, b) {
      if (!a || !b) return '';
      const setA = new Set(a.replace(/\D/g, '').split(''));
      const setB = new Set(b.replace(/\D/g, '').split(''));
      const common = [...setA].filter(d => setB.has(d)).sort();
      return common.length ? common.join('') : '';
    }

    function updateResult(row) {
      const left = row.querySelector('.left-input').value;
      const mid = row.querySelector('.mid-input').value;
      const resultInput = row.querySelector('.result-input');
      const common = findCommonDigits(left, mid);
      resultInput.value = common;
    }

    function saveToStorage() {
      const rows = document.querySelectorAll('#tbody tr');
      const data = [];
      rows.forEach(row => {
        data.push([
          row.querySelector('.left-input').value,
          row.querySelector('.mid-input').value,
          row.querySelector('.result-input').value,
          row.querySelector('.right-input').value
        ]);
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return null;
    }

    function createRow(idx, leftVal, midVal, resultVal, rightVal) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="weekday-cell">${getWeekday(idx)}</td>
        <td><input class="left-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${leftVal}" placeholder="" autocomplete="off"></td>
        <td><input class="mid-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${midVal}" placeholder="" autocomplete="off"></td>
        <td><input class="result-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${resultVal}" placeholder="" autocomplete="off"></td>
        <td><input class="right-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${rightVal}" placeholder="" autocomplete="off"></td>
      `;
      tr.querySelector('.left-input').addEventListener('input', () => { updateResult(tr); saveToStorage(); });
      tr.querySelector('.mid-input').addEventListener('input', () => { updateResult(tr); saveToStorage(); });
      tr.querySelector('.result-input').addEventListener('input', () => saveToStorage());
      tr.querySelector('.right-input').addEventListener('input', () => saveToStorage());
      return tr;
    }

    function renderData(data) {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      data.forEach((pair, i) => {
        const row = createRow(i, pair[0] || '', pair[1] || '', pair[2] || '', pair[3] || '');
        tbody.appendChild(row);
        updateResult(row);
      });
    }

    function addRow() {
      const tbody = document.getElementById('tbody');
      const row = createRow(tbody.children.length, '', '', '', '');
      tbody.appendChild(row);
      saveToStorage();
    }

    function clearAllData() {
      if (!confirm('确定要清空所有数据吗？此操作不可恢复。')) return;
      localStorage.removeItem(STORAGE_KEY);
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      const row = createRow(0, '', '', '', '');
      tbody.appendChild(row);
      saveToStorage();
    }

    function exportCol1() {
      const rows = document.querySelectorAll('#tbody tr');
      const lines = [];
      rows.forEach(row => { lines.push(row.querySelector('.left-input').value); });
      const txt = lines.join('\n');
      const blob = new Blob([txt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '列1数据_' + new Date().toLocaleDateString() + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importCol1(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.split(/\r?\n/).map(l => l.trim());
        const tbody = document.getElementById('tbody');
        const rows = tbody.querySelectorAll('tr');
        lines.forEach((val, i) => {
          if (i < rows.length) {
            rows[i].querySelector('.left-input').value = val;
            updateResult(rows[i]);
          } else {
            const row = createRow(i, val, '', '', '');
            tbody.appendChild(row);
          }
        });
        saveToStorage();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportCol2() {
      const rows = document.querySelectorAll('#tbody tr');
      const lines = [];
      rows.forEach(row => { lines.push(row.querySelector('.mid-input').value); });
      const txt = lines.join('\n');
      const blob = new Blob([txt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '列2数据_' + new Date().toLocaleDateString() + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importCol2(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.split(/\r?\n/).map(l => l.trim());
        const tbody = document.getElementById('tbody');
        const rows = tbody.querySelectorAll('tr');
        lines.forEach((val, i) => {
          if (i < rows.length) {
            rows[i].querySelector('.mid-input').value = val;
            updateResult(rows[i]);
          } else {
            const row = createRow(i, '', val, '', '');
            tbody.appendChild(row);
          }
        });
        saveToStorage();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportCol4() {
      const rows = document.querySelectorAll('#tbody tr');
      const lines = [];
      rows.forEach(row => { lines.push(row.querySelector('.right-input').value); });
      const txt = lines.join('\n');
      const blob = new Blob([txt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '列4数据_' + new Date().toLocaleDateString() + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importCol4(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.split(/\r?\n/).map(l => l.trim());
        const tbody = document.getElementById('tbody');
        const rows = tbody.querySelectorAll('tr');
        lines.forEach((val, i) => {
          if (i < rows.length) {
            rows[i].querySelector('.right-input').value = val;
          } else {
            const row = createRow(i, '', '', '', val);
            tbody.appendChild(row);
          }
        });
        saveToStorage();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    const savedData = loadFromStorage();
    if (savedData && savedData.length > 0) {
      renderData(savedData);
    } else {
      renderData(defaultData);
    }
  </script>
</body>
</html>
